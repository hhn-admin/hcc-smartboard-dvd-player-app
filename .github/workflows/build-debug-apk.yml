name: Build debug APK

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # v3 still asks sdkmanager for the removed "tools" package and fails
      # before Gradle starts. v4 installs platform-tools only.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install compile SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: dvd-player-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
